name: daily-video

on:
  schedule:
    - cron: "30 2 * * *"          # roz 08:00 IST (GitHub 10-30 min late kar sakta hai)
  workflow_dispatch:
    inputs:
      count:
        description: "Kitne video banane hain? (shuru me 7 daalo = hafte ka stock)"
        default: "1"

permissions:
  contents: write                  # state commit + release
  actions: write                   # workflow ko zinda rakhne ke liye (60-din wala rule)

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts, espeak)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-freefont-ttf espeak-ng libraqm0 libfribidi0 libharfbuzz0b

      - name: Image cache (purani images fallback ke kaam aati hain)
        uses: actions/cache@v4
        with:
          path: cache
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      - run: pip install -r requirements.txt

      - name: Video banao
        run: python main.py daily --count "${{ inputs.count || '1' }}"

      - name: Backup (GitHub Artifacts, 7 din)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 7
          if-no-files-found: ignore

      - name: State save (ye roz ka commit repo ko 'active' rakhta hai)
        if: always()
        run: |
          git config user.name "rhymes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git commit -m "state update $(date -u +%F)" || echo "kuch badla nahi"
          git pull --rebase || true
          git push || echo "push fail (agle run me theek ho jayega)"

      - name: Workflows ko zinda rakho
        if: always()
        run: |
          for w in daily.yml weekly.yml voice.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail alert
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Aaj ka video nahi bana. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}  (agli baar apne aap extra bana dunga)" || true
