name: voice-video

# my_voice/ folder me apni recording (naam = video ID, jaise 20261017-001-chintu.m4a) upload karte hi chalta hai.
on:
  push:
    paths:
      - "my_voice/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-freefont-ttf libraqm0 libfribidi0 libharfbuzz0b
      - uses: actions/cache@v4
        with:
          path: cache
          key: assets-${{ github.run_id }}
          restore-keys: assets-
      - run: pip install -r requirements.txt
      - run: python main.py voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out
          retention-days: 7
          if-no-files-found: ignore
      - name: State save
        if: always()
        run: |
          git config user.name "rhymes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git commit -m "voice state update" || echo "kuch badla nahi"
          git pull --rebase || true
          git push || true
